version: '3.8'

# Изолированная тестовая БД: тот же образ и тот же init-db.sql, что и в
# боевом docker-compose.yml, но другой контейнер, другой порт на хосте
# (55432) и отдельный volume. Запуск:
#   docker compose -f tests/docker-compose.test.yml up -d
# Pytest при этом подключается по адресу localhost:55432 (см. conftest.py).

services:
  postgres_test:
    image: postgis/postgis:15-3.5
    platform: linux/amd64
    container_name: sportapp_postgres_test
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test_db
    ports:
      - "55432:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ../init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test_db"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Настоящий Redis для перформанс-тестов кеша (tests/perf/test_cache.py).
  # Обычные интеграционные тесты его НЕ используют — там подменяется на
  # fakeredis. Отдельный контейнер на нестандартном порту 56379, чтобы не
  # пересекаться ни с боевым Redis (docker-compose.yml), ни с локально
  # установленным redis-server у разработчика.
  redis_test:
    image: redis:7-alpine
    container_name: sportapp_redis_test
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  postgres_test_data:
