version: '3.8'

services:
  # PostgreSQL с PostGIS расширением для геоданных
  postgres:
    image: postgis/postgis:15-3.3
    container_name: sportapp_postgres
    environment:
      POSTGRES_USER: sportapp_user
      POSTGRES_PASSWORD: sportapp_password
      POSTGRES_DB: sportapp_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportapp_user -d sportapp_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sportapp_network

  # Redis для кеша и активных сессий
  redis:
    image: redis:7-alpine
    container_name: sportapp_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sportapp_network

  # RabbitMQ для message broker (Celery)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: sportapp_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: sportapp_user
      RABBITMQ_DEFAULT_PASS: sportapp_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sportapp_network

  # Auth Service
  auth_service:
    build:
      context: ./services/auth_service
      dockerfile: Dockerfile
    container_name: sportapp_auth
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://sportapp_user:sportapp_password@postgres:5432/sportapp_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      JWT_ACCESS_TOKEN_EXPIRES: 3600
      SERVICE_PORT: 5001
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sportapp_network
    restart: unless-stopped

  # Map Service
  map_service:
    build:
      context: ./services/map_service
      dockerfile: Dockerfile
    container_name: sportapp_map
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://sportapp_user:sportapp_password@postgres:5432/sportapp_db
      REDIS_URL: redis://redis:6379/0
      SERVICE_PORT: 5002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sportapp_network
    restart: unless-stopped

  # Game Session Service
  game_session_service:
    build:
      context: ./services/game_session_service
      dockerfile: Dockerfile
    container_name: sportapp_game
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://sportapp_user:sportapp_password@postgres:5432/sportapp_db
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://sportapp_user:sportapp_password@rabbitmq:5672/
      SERVICE_PORT: 5003
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - sportapp_network
    restart: unless-stopped

  # Notification Service (WebSocket)
  notification_service:
    build:
      context: ./services/notification_service
      dockerfile: Dockerfile
    container_name: sportapp_notification
    environment:
      FLASK_ENV: production
      REDIS_URL: redis://redis:6379/1
      SERVICE_PORT: 5004
    ports:
      - "5004:5004"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - sportapp_network
    restart: unless-stopped

  # Celery Worker для фоновых задач
  celery_worker:
    build:
      context: ./services/game_session_service
      dockerfile: Dockerfile
    container_name: sportapp_celery
    command: celery -A app.celery worker --loglevel=info
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://sportapp_user:sportapp_password@postgres:5432/sportapp_db
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://sportapp_user:sportapp_password@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - sportapp_network
    restart: unless-stopped

  # Celery Beat для периодических задач
  celery_beat:
    build:
      context: ./services/game_session_service
      dockerfile: Dockerfile
    container_name: sportapp_celery_beat
    command: celery -A app.celery beat --loglevel=info
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://sportapp_user:sportapp_password@postgres:5432/sportapp_db
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://sportapp_user:sportapp_password@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - sportapp_network
    restart: unless-stopped

  # API Gateway
  api_gateway:
    build:
      context: ./services/api_gateway
      dockerfile: Dockerfile
    container_name: sportapp_gateway
    environment:
      FLASK_ENV: production
      AUTH_SERVICE_URL: http://auth_service:5001
      MAP_SERVICE_URL: http://map_service:5002
      GAME_SERVICE_URL: http://game_session_service:5003
      NOTIFICATION_SERVICE_URL: http://notification_service:5004
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      SERVICE_PORT: 5000
    ports:
      - "5005:5000"
    depends_on:
      - auth_service
      - map_service
      - game_session_service
      - notification_service
    networks:
      - sportapp_network
    restart: unless-stopped

  # Frontend (с встроенным nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://localhost
        REACT_APP_WS_URL: http://localhost
        REACT_APP_YANDEX_MAPS_API_KEY: ${YANDEX_MAPS_API_KEY:-your-api-key}
    container_name: sportapp_frontend
    ports:
      - "80:80"
    depends_on:
      - api_gateway
      - notification_service
    networks:
      - sportapp_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  sportapp_network:
    driver: bridge
